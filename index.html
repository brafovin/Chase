<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <title>Geometric Dash – Flying Wave Challenge</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;display:flex;justify-content:center;align-items:center;
         min-height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif}
    canvas{display:block;cursor:pointer;touch-action:none}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=800,H=450;
let scale=1;
function resize(){
  scale=Math.min(innerWidth/W,innerHeight/H);
  canvas.width=Math.floor(W*scale); canvas.height=Math.floor(H*scale);
  ctx.setTransform(scale,0,0,scale,0,0);
  buildCaches();
}
window.addEventListener('resize',resize);

// ── Persistence ───────────────────────────────────────────────────────────────
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch(_){return d}};
let hiScore=ld('gdHS',0), totalCoins=ld('gdCoins',0),
    unlockedSkins=ld('gdSkins',[0]), selSkin=ld('gdSkin',0), achs=ld('gdAch',{});

// ── Skins ─────────────────────────────────────────────────────────────────────
const SKINS=[
  {name:'Classic', cost:0,   primary:'#00ffee', glow:'#00ffcc', core:'#ffffff'},
  {name:'Inferno', cost:50,  primary:'#ff6600', glow:'#ff3300', core:'#ffcc00'},
  {name:'Venom',   cost:100, primary:'#44ff00', glow:'#22cc00', core:'#ccff88'},
  {name:'Royal',   cost:150, primary:'#cc44ff', glow:'#9900ff', core:'#eeccff'},
  {name:'Gold',    cost:300, primary:'#ffd700', glow:'#cc8800', core:'#fffacc'},
];

// ── Achievements ──────────────────────────────────────────────────────────────
const ACH=[
  {id:'s100', label:'Novice',      desc:'Score 100',    check:g=>g.score>=100},
  {id:'s500', label:'Daredevil',   desc:'Score 500',    check:g=>g.score>=500},
  {id:'s1k',  label:'Wave Master', desc:'Score 1000',   check:g=>g.score>=1000},
  {id:'c10',  label:'Collector',   desc:'10 coins',     check:()=>totalCoins>=10},
  {id:'c50',  label:'Hoarder',     desc:'50 coins',     check:()=>totalCoins>=50},
];
function checkAch(g){
  for(const a of ACH) if(!achs[a.id]&&a.check(g)){achs[a.id]=true;sv('gdAch',achs);return a;}
  return null;
}

// ── Audio ─────────────────────────────────────────────────────────────────────
let AC=null;
const ensureAC=()=>{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)()};
function beep(f,t,d,v=0.12){
  ensureAC();const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(v,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.start();o.stop(AC.currentTime+d);
}
const sndClick=()=>beep(660,'square',0.07);
const sndCoin=()=>{beep(1200,'sine',0.06,0.12);setTimeout(()=>beep(2400,'sine',0.08,0.1),60)};
function sndBoom(){
  ensureAC();const buf=AC.createBuffer(1,AC.sampleRate*0.3,AC.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=buf;s.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(0.4,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.3);s.start();
}
let musicId=null;
function startMusic(){
  ensureAC();if(musicId)return;
  const notes=[261,293,329,349,392,440,493,523];
  const pat=[0,2,4,7,4,2,0,2,4,5,7,5,4,5,7,9];
  let step=0;
  musicId=setInterval(()=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type='sawtooth';o.frequency.value=notes[pat[step%pat.length]%notes.length]*0.5;
    g.gain.setValueAtTime(0.05,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.2);
    o.start();o.stop(AC.currentTime+0.2);step++;
  },187);
}
function stopMusic(){if(musicId){clearInterval(musicId);musicId=null;}}

// ── Caches ────────────────────────────────────────────────────────────────────
// Brick tile for wall fill
let brickCache=null;
// Star field for deep background
let starField=null;

function buildCaches(){
  // Brick tile: 40×40 teal bricks
  const T=40;
  brickCache=document.createElement('canvas');
  brickCache.width=T*2; brickCache.height=T*2;
  const b=brickCache.getContext('2d');
  for(let r=0;r<2;r++) for(let c=0;c<2;c++){
    const x=c*T,y=r*T;
    b.fillStyle=(r+c)%2===0?'#093040':'#0b3a4c';
    b.fillRect(x,y,T,T);
    b.fillStyle='rgba(0,200,230,0.07)';
    b.fillRect(x+3,y+3,T-6,T/2-2);
    b.strokeStyle='#0d5a70';b.lineWidth=1;
    b.strokeRect(x+0.5,y+0.5,T-1,T-1);
  }

  // Star field (static, parallax layer 0)
  starField=document.createElement('canvas');
  starField.width=W*2; starField.height=H;
  const sf=starField.getContext('2d');
  sf.fillStyle='#000810';sf.fillRect(0,0,W*2,H);
  for(let i=0;i<120;i++){
    const sx=Math.random()*W*2, sy=Math.random()*H;
    const r=0.4+Math.random()*1.2;
    const a=0.2+Math.random()*0.6;
    sf.globalAlpha=a; sf.fillStyle='#88ddff';
    sf.beginPath();sf.arc(sx,sy,r,0,Math.PI*2);sf.fill();
  }
  sf.globalAlpha=1;
}

// ── Math helpers ──────────────────────────────────────────────────────────────
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

// ── Constants ─────────────────────────────────────────────────────────────────
const PX=130;          // player fixed screen x
const WAVE_SPD=3.8;    // vertical speed — fast enough to see diagonal movement clearly
const PR=8;            // player collision radius
const TOOTH_W=110;     // wide tooth base — matches reference images (few large peaks, not many small)
const TOOTH_H=68;      // tall tooth height for sharp mountain-peak look
// MIN_HG: must fit TOOTH_H + player clearance. TOOTH_H+PR+margin = 68+8+14 = 90
const MIN_HG=92;       // absolute minimum half-gap
const WALL_PAD=6;      // min wall edge from screen top/bottom

// ── Difficulty ────────────────────────────────────────────────────────────────
// gapS/gapF are half-gap values. Effective playable = (gapF*2) - (TOOTH_H*2).
// normal gapF=80 → raw 160px → effective 60px. Tight but fair.
// gapF must be > MIN_HG (92). Effective play zone = gapF*2 - TOOTH_H*2
// easy gapF=115 → 230px raw → 94px effective. normal gapF=105 → 74px. hard gapF=95 → 54px.
const DIFFS={
  easy:  {spd0:1.8,spd1:3.2,gapS:200,gapF:115, coins:0.28},
  normal:{spd0:2.0,spd1:5.0,gapS:180,gapF:105, coins:0.16},
  hard:  {spd0:2.5,spd1:6.5,gapS:160,gapF:95,  coins:0.10},
};
let difficulty='normal';

// ── Corridor node system ──────────────────────────────────────────────────────
// node: {x (world), topY (inner edge of top wall), botY (inner edge of bottom wall)}
// player safe zone: topY+SPIKE_H  …  botY-SPIKE_H
function sampleCorridor(nodes,wx){
  if(!nodes.length) return{topY:H/2-80,botY:H/2+80};
  if(wx<=nodes[0].x) return{topY:nodes[0].topY,botY:nodes[0].botY};
  const last=nodes[nodes.length-1];
  if(wx>=last.x) return{topY:last.topY,botY:last.botY};
  let lo=0,hi=nodes.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(nodes[m].x<=wx)lo=m;else hi=m;}
  const n0=nodes[lo],n1=nodes[hi];
  const t=(wx-n0.x)/(n1.x-n0.x),s=t*t*(3-2*t);
  return{topY:lerp(n0.topY,n1.topY,s),botY:lerp(n0.botY,n1.botY,s)};
}

function makeSection(startX,sTopY,sBotY,score){
  const cfg=DIFFS[difficulty];
  const prog=Math.min(1,score/1000);
  const minHG=Math.max(MIN_HG,Math.round(lerp(cfg.gapS*0.8,cfg.gapF,prog)));
  const maxHG=Math.max(minHG+18,Math.round(lerp(cfg.gapS,cfg.gapS*0.6,prog)));
  const curCY=(sTopY+sBotY)/2, curHG=(sBotY-sTopY)/2;
  const r=Math.random();
  let type;
  if(score<100) type='flat';
  else if(score<250){
    type=r<0.40?'flat':r<0.70?'rise':r<0.95?'fall':'recovery';
  } else if(score<450){
    type=r<0.18?'flat':r<0.38?'rise':r<0.58?'fall':r<0.78?'recovery':r<0.95?'zigzag':'narrow';
  } else if(score<700){
    type=r<0.10?'flat':r<0.27?'rise':r<0.44?'fall':r<0.62?'zigzag':r<0.80?'recovery':'narrow';
  } else {
    type=r<0.08?'flat':r<0.22?'rise':r<0.36?'fall':r<0.55?'zigzag':r<0.72?'narrow':'recovery';
  }

  const secLen=lerp(210,140,prog)+Math.random()*lerp(110,60,prog);
  const nc=Math.max(3,Math.floor(secLen/26));
  const spd=lerp(cfg.spd0,cfg.spd1,Math.min(1,score/400))+Math.max(0,score-400)*0.001;
  const maxV=WAVE_SPD*(secLen/spd)*0.6;
  const nodes=[];

  function build(cyFn,hgFn){
    for(let i=0;i<nc;i++){
      const t=nc<=1?0:i/(nc-1);
      const hg=clamp(hgFn(t),minHG,maxHG);
      const cy=clamp(cyFn(t),WALL_PAD+hg+6,H-WALL_PAD-hg-6);
      const tY=clamp(cy-hg,WALL_PAD,H-WALL_PAD-hg*2);
      nodes.push({x:startX+t*secLen,topY:tY,botY:tY+hg*2});
    }
  }

  switch(type){
    case 'flat':{
      const tHG=lerp(curHG,(minHG+maxHG)*0.55,0.35);
      build(()=>curCY,t=>lerp(curHG,tHG,t)); break;
    }
    case 'rise':{
      const d=Math.min(maxV*0.5,H*0.20);
      const tCY=clamp(curCY-d,WALL_PAD+minHG+10,H-WALL_PAD-minHG-10);
      const tHG=lerp(curHG,(minHG+maxHG)*0.58,0.45);
      build(t=>lerp(curCY,tCY,t),t=>lerp(curHG,tHG,t)); break;
    }
    case 'fall':{
      const d=Math.min(maxV*0.5,H*0.20);
      const tCY=clamp(curCY+d,WALL_PAD+minHG+10,H-WALL_PAD-minHG-10);
      const tHG=lerp(curHG,(minHG+maxHG)*0.58,0.45);
      build(t=>lerp(curCY,tCY,t),t=>lerp(curHG,tHG,t)); break;
    }
    case 'zigzag':{
      const amp=Math.min(maxV*0.38,H*0.15);
      const freq=1.1+Math.random()*0.8;
      build(
        t=>clamp(curCY+Math.sin(t*Math.PI*freq)*amp,WALL_PAD+minHG+8,H-WALL_PAD-minHG-8),
        t=>lerp(curHG,(minHG+maxHG)*0.52,Math.abs(Math.sin(t*Math.PI)))
      ); break;
    }
    case 'narrow':{
      const tHG=clamp(minHG+(maxHG-minHG)*0.1,minHG,maxHG*0.42);
      const cy=clamp(curCY,WALL_PAD+tHG+10,H-WALL_PAD-tHG-10);
      build(()=>cy,t=>lerp(curHG,tHG,Math.sin(t*Math.PI))); break;
    }
    case 'recovery':{
      const tHG=clamp(maxHG*0.88,minHG+20,maxHG);
      build(t=>lerp(curCY,H/2,t*0.5),t=>lerp(curHG,tHG,t)); break;
    }
    default:
      nodes.push({x:startX,topY:sTopY,botY:sBotY});
      nodes.push({x:startX+secLen,topY:sTopY,botY:sBotY});
  }

  // Validate
  for(const n of nodes){
    n.topY=clamp(n.topY,WALL_PAD,H-WALL_PAD-MIN_HG*2);
    n.botY=clamp(n.botY,n.topY+MIN_HG*2,H-WALL_PAD);
  }
  return nodes;
}

// ── Speed lines (convey motion) ───────────────────────────────────────────────
const SPEED_LINES=Array.from({length:22},()=>({
  y:Math.random()*H, len:40+Math.random()*120, speed:8+Math.random()*14,
  alpha:0.08+Math.random()*0.18, x:Math.random()*W,
}));
function updateSpeedLines(){
  for(const l of SPEED_LINES){
    l.x-=l.speed;
    if(l.x+l.len<0){l.x=W+l.len;l.y=Math.random()*H;}
  }
}
function drawSpeedLines(){
  ctx.save();
  for(const l of SPEED_LINES){
    ctx.globalAlpha=l.alpha;
    const g=ctx.createLinearGradient(l.x,0,l.x+l.len,0);
    g.addColorStop(0,'rgba(0,240,255,0)');
    g.addColorStop(0.5,'rgba(0,240,255,1)');
    g.addColorStop(1,'rgba(0,240,255,0)');
    ctx.strokeStyle=g; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x+l.len,l.y);ctx.stroke();
  }
  ctx.restore();
}

// ── Particles ─────────────────────────────────────────────────────────────────
class Particle{
  constructor(x,y,col,vx,vy,life,size){Object.assign(this,{x,y,col,vx,vy,life,maxLife:life,size});}
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.05;this.life--;}
  draw(){
    const a=this.life/this.maxLife;
    ctx.globalAlpha=a*0.9;ctx.fillStyle=this.col;
    ctx.beginPath();ctx.arc(this.x,this.y,this.size*a,0,Math.PI*2);ctx.fill();
  }
}

// ── Trail ─────────────────────────────────────────────────────────────────────
class Trail{
  constructor(){this.pts=[];}
  add(x,y){this.pts.push({x,y});if(this.pts.length>38)this.pts.shift();}
  draw(skin){
    if(this.pts.length<2)return;
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    // Pass 1: wide outer glow (shows the diagonal path the ship just travelled)
    for(let i=1;i<this.pts.length;i++){
      const t=i/this.pts.length;
      ctx.beginPath();
      ctx.moveTo(this.pts[i-1].x,this.pts[i-1].y);
      ctx.lineTo(this.pts[i].x,this.pts[i].y);
      ctx.strokeStyle=skin.glow; ctx.globalAlpha=t*0.25; ctx.lineWidth=t*20;
      ctx.shadowBlur=0; ctx.stroke();
    }
    // Pass 2: medium bright line
    for(let i=1;i<this.pts.length;i++){
      const t=i/this.pts.length;
      ctx.beginPath();
      ctx.moveTo(this.pts[i-1].x,this.pts[i-1].y);
      ctx.lineTo(this.pts[i].x,this.pts[i].y);
      ctx.strokeStyle=skin.primary; ctx.globalAlpha=t*0.7; ctx.lineWidth=t*6;
      ctx.stroke();
    }
    // Pass 3: bright white core
    for(let i=1;i<this.pts.length;i++){
      const t=i/this.pts.length;
      ctx.beginPath();
      ctx.moveTo(this.pts[i-1].x,this.pts[i-1].y);
      ctx.lineTo(this.pts[i].x,this.pts[i].y);
      ctx.strokeStyle='#ffffff'; ctx.globalAlpha=t*0.5; ctx.lineWidth=t*2;
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ── Screen shake ──────────────────────────────────────────────────────────────
let shakeAmt=0;
const addShake=a=>{shakeAmt=Math.max(shakeAmt,a)};

// ── Buttons ───────────────────────────────────────────────────────────────────
let buttons=[];
function btn(label,x,y,w,h,col,action,sub){buttons.push({label,x,y,w,h,col,action,sub});}
function drawBtns(){
  for(const b of buttons){
    ctx.save();
    ctx.shadowBlur=20;ctx.shadowColor=b.col;
    ctx.fillStyle='rgba(0,5,15,0.80)';rr(ctx,b.x,b.y,b.w,b.h,10);ctx.fill();
    ctx.strokeStyle=b.col;ctx.lineWidth=2;rr(ctx,b.x,b.y,b.w,b.h,10);ctx.stroke();
    // Subtle top shine
    ctx.fillStyle='rgba(255,255,255,0.04)';
    rr(ctx,b.x+2,b.y+2,b.w-4,b.h/2-2,8);ctx.fill();
    ctx.shadowBlur=8;ctx.shadowColor='#fff';ctx.fillStyle='#fff';
    ctx.font=`bold ${b.sub?16:19}px "Segoe UI"`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2-(b.sub?7:0));
    if(b.sub){ctx.font='12px "Segoe UI"';ctx.fillStyle='#88ccee';ctx.shadowBlur=0;
      ctx.fillText(b.sub,b.x+b.w/2,b.y+b.h/2+11);}
    ctx.restore();
  }
}
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

// ── Draw: layered background ──────────────────────────────────────────────────
function drawBg(dist){
  // Layer 0: deep space (star field, very slow parallax)
  if(starField){
    const ox=-((dist*0.05)%(W*2));
    ctx.drawImage(starField,ox,0);
    ctx.drawImage(starField,ox+W*2,0);
  }
  // Layer 1: subtle distant grid lines (slow)
  const G2=80, ox2=-((dist*0.15)%G2);
  ctx.save();ctx.strokeStyle='rgba(0,120,160,0.12)';ctx.lineWidth=0.8;
  for(let x=ox2;x<W+G2;x+=G2){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=G2){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();
  // Layer 2: nearer grid (medium speed)
  const G3=44, ox3=-((dist*0.45)%G3);
  ctx.save();ctx.strokeStyle='rgba(0,180,210,0.08)';ctx.lineWidth=0.6;
  for(let x=ox3;x<W+G3;x+=G3){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  ctx.restore();
}

// ── Sample screen-space corridor at a given screen-x ─────────────────────────
function sampleSX(nodes,sx){
  if(!nodes.length) return{topY:H/2-80,botY:H/2+80};
  if(sx<=nodes[0].sx) return{topY:nodes[0].topY,botY:nodes[0].botY};
  const last=nodes[nodes.length-1];
  if(sx>=last.sx) return{topY:last.topY,botY:last.botY};
  for(let i=0;i<nodes.length-1;i++){
    if(sx>=nodes[i].sx&&sx<=nodes[i+1].sx){
      const t=(sx-nodes[i].sx)/(nodes[i+1].sx-nodes[i].sx),s=t*t*(3-2*t);
      return{topY:lerp(nodes[i].topY,nodes[i+1].topY,s),botY:lerp(nodes[i].botY,nodes[i+1].botY,s)};
    }
  }
  return{topY:last.topY,botY:last.botY};
}

// ── Draw: solid zigzag walls matching reference images ────────────────────────
function drawWalls(nodes,dist){
  if(nodes.length<2) return;

  const x0=nodes[0].sx - TOOTH_W*2;
  const xN=nodes[nodes.length-1].sx + TOOTH_W*2;

  // Sample the corridor edge at each tooth boundary and midpoint
  // topPts / botPts are the inner-edge polylines (the jagged boundary)
  // Pattern per tooth: left-base, tip, right-base (no duplicate points — each tooth shares
  // its right-base with the next tooth's left-base, so we only push left-base + tip per tooth,
  // then add the final right-base at the end)
  const topPts=[], botPts=[];
  for(let sx=x0; sx<xN; sx+=TOOTH_W){
    const L=sampleSX(nodes,sx);
    const M=sampleSX(nodes,sx+TOOTH_W*0.5);
    topPts.push({x:sx,            y:L.topY});          // base left
    topPts.push({x:sx+TOOTH_W*0.5,y:M.topY+TOOTH_H}); // tip (points DOWN into gap)
    botPts.push({x:sx,            y:L.botY});           // base left
    botPts.push({x:sx+TOOTH_W*0.5,y:M.botY-TOOTH_H}); // tip (points UP into gap)
  }
  // Close the last tooth's right base
  const finalR=sampleSX(nodes,xN);
  topPts.push({x:xN, y:finalR.topY});
  botPts.push({x:xN, y:finalR.botY});

  ctx.save();

  // Helper: fill a wall polygon (outer edge = screen edge, inner = jagged polyline)
  function fillWall(pts, screenEdgeY, isTop){
    ctx.beginPath();
    // Start at top/bottom screen edge, left side
    ctx.moveTo(x0, screenEdgeY);
    // Walk along the inner jagged edge left→right
    for(const p of pts) ctx.lineTo(p.x, p.y);
    // Close back to screen edge, right side
    ctx.lineTo(xN, screenEdgeY);
    ctx.closePath();

    // Brick texture fill
    if(brickCache){
      const pat=ctx.createPattern(brickCache,'repeat');
      const m=new DOMMatrix(); m.translateSelf(-(dist%brickCache.width),0);
      pat.setTransform(m); ctx.fillStyle=pat;
    } else ctx.fillStyle='#0a2a3a';
    ctx.fill();

    // Dark overlay so bricks sit behind the glow
    ctx.beginPath();
    ctx.moveTo(x0,screenEdgeY);
    for(const p of pts) ctx.lineTo(p.x,p.y);
    ctx.lineTo(xN,screenEdgeY); ctx.closePath();
    ctx.fillStyle='rgba(0,8,18,0.52)'; ctx.fill();
  }

  fillWall(topPts, -4, true);
  fillWall(botPts, H+4, false);

  // ── Glow on inner jagged edge — 3 passes ──────────────────────────────────
  // Pass 1: wide soft halo
  // Pass 2: medium bright glow
  // Pass 3: sharp bright white edge
  const edgePasses=[
    {lw:18, alpha:0.07, col:'#00ccff', sb:0},
    {lw:5,  alpha:0.40, col:'#00eeff', sb:14},
    {lw:2,  alpha:1.00, col:'#ddfaff', sb:18},
  ];
  ctx.lineJoin='miter'; ctx.miterLimit=10; // keep peaks sharp, no rounding
  for(const ep of edgePasses){
    ctx.globalAlpha=ep.alpha; ctx.lineWidth=ep.lw;
    ctx.strokeStyle=ep.col; ctx.shadowBlur=ep.sb; ctx.shadowColor=ep.col;
    // top edge
    ctx.beginPath();
    for(let i=0;i<topPts.length;i++) i===0?ctx.moveTo(topPts[i].x,topPts[i].y):ctx.lineTo(topPts[i].x,topPts[i].y);
    ctx.stroke();
    // bottom edge
    ctx.beginPath();
    for(let i=0;i<botPts.length;i++) i===0?ctx.moveTo(botPts[i].x,botPts[i].y):ctx.lineTo(botPts[i].x,botPts[i].y);
    ctx.stroke();
  }

  ctx.globalAlpha=1; ctx.shadowBlur=0;
  ctx.restore();
}

// ── Draw: player ship ─────────────────────────────────────────────────────────
function drawPlayer(py,pressing,skin,alpha,grace){
  // Steep tilt so the ship visually shows diagonal movement direction
  const angle=(pressing?-1:1)*0.52;
  const blink=grace?(0.4+0.6*Math.abs(Math.sin(Date.now()*0.018))):1;
  ctx.save();
  ctx.globalAlpha=alpha*blink;
  ctx.translate(PX,py);ctx.rotate(angle);

  // Outer aura (wide, very transparent)
  ctx.shadowBlur=0;
  ctx.fillStyle=skin.glow;ctx.globalAlpha=alpha*blink*0.15;
  ctx.beginPath();
  ctx.moveTo(22,0);ctx.lineTo(-10,-16);ctx.lineTo(-16,0);ctx.lineTo(-10,16);
  ctx.closePath();ctx.fill();

  // Main glow pass (medium)
  ctx.globalAlpha=alpha*blink*0.55;
  ctx.fillStyle=skin.primary;
  ctx.shadowBlur=22;ctx.shadowColor=skin.glow;
  ctx.beginPath();
  ctx.moveTo(18,0);ctx.lineTo(-8,-13);ctx.lineTo(-12,0);ctx.lineTo(-8,13);
  ctx.closePath();ctx.fill();

  // Sharp body
  ctx.globalAlpha=alpha*blink;
  ctx.fillStyle=skin.primary;
  ctx.shadowBlur=10;ctx.shadowColor=skin.glow;
  ctx.beginPath();
  ctx.moveTo(16,0);    // nose
  ctx.lineTo(-7,-10);  // top wing
  ctx.lineTo(-4,0);    // rear notch
  ctx.lineTo(-7,10);   // bottom wing
  ctx.closePath();ctx.fill();

  // White outline
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.4;ctx.stroke();

  // Bright core line
  ctx.strokeStyle=skin.core;ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(13,0);ctx.lineTo(-5,-7);ctx.lineTo(-2,0);ctx.lineTo(-5,7);
  ctx.closePath();ctx.stroke();

  // Cockpit highlight dot
  ctx.fillStyle=skin.core;ctx.shadowBlur=6;ctx.shadowColor='#fff';
  ctx.beginPath();ctx.arc(4,0,2,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

// ── Draw: coin ────────────────────────────────────────────────────────────────
function drawCoin(x,y,t){
  const p=0.8+0.2*Math.sin(t*0.07+x);
  ctx.save();ctx.globalAlpha=p;
  ctx.shadowBlur=14;ctx.shadowColor='#ffd700';
  // Outer ring
  ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.stroke();
  // Fill
  const g=ctx.createRadialGradient(x-2,y-2,1,x,y,9);
  g.addColorStop(0,'#ffe87a');g.addColorStop(1,'#cc8800');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff8dc';ctx.font='bold 9px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowBlur=0;
  ctx.fillText('$',x,y);
  ctx.restore();
}

// ── Draw: vignette ────────────────────────────────────────────────────────────
function drawVignette(){

}

// ── Game class ────────────────────────────────────────────────────────────────
const S={MENU:'m',DIFF:'d',SKIN:'sk',PLAY:'p',PAUSE:'pa',DEAD:'de'};
let state=S.MENU;

class Game{
  constructor(){
    const cfg=DIFFS[difficulty];
    this.spd=cfg.spd0; this.dist=0; this.score=0; this.newHS=false;
    this.parts=[]; this.trail=new Trail(); this.coins=[];
    this.achPopup=null; this.achTimer=0;
    this.py=H/2; this.pressing=false;
    this.alive=true; this.deathTimer=0;
    this.grace=120;  // ~2s grace at start
    this.nodes=[]; this._genX=0;
    this._seed(); while(this._genX<W+1400) this._extend();
  }

  _seed(){
    const cfg=DIFFS[difficulty];
    const hg=cfg.gapS+30, cy=H/2;
    // 800px of wide flat opening
    for(let x=0;x<=800;x+=TOOTH_W) this.nodes.push({x,topY:cy-hg,botY:cy+hg});
    this._genX=800;
  }

  _extend(){
    const last=this.nodes[this.nodes.length-1]||{x:0,topY:H/2-80,botY:H/2+80};
    const newNodes=makeSection(last.x,last.topY,last.botY,this.score);
    for(const n of newNodes) if(n.x>last.x) this.nodes.push(n);
    // Coin in middle of section
    const cfg=DIFFS[difficulty];
    if(Math.random()<cfg.coins&&newNodes.length>=2){
      const mid=newNodes[Math.floor(newNodes.length/2)];
      const cy=(mid.topY+mid.botY)/2;
      this.coins.push({x:mid.x,y:cy,done:false});
    }
    this._genX=this.nodes[this.nodes.length-1].x;
  }

  setPressed(v){if(!this.alive)return;if(v!==this.pressing){this.pressing=v;sndClick();}}

  update(){
    if(!this.alive){
      this.deathTimer++;
      for(const p of this.parts)p.update();
      this.parts=this.parts.filter(p=>p.life>0);
      if(shakeAmt>0.1)shakeAmt*=0.75;else shakeAmt=0;
      return;
    }
    if(this.grace>0)this.grace--;

    const cfg=DIFFS[difficulty];
    const baseSpd=lerp(cfg.spd0,cfg.spd1,Math.min(1,this.score/400));
    this.spd=baseSpd+Math.max(0,this.score-400)*0.001;

    // True wave: instant diagonal direction
    this.py=clamp(this.py+(this.pressing?-WAVE_SPD:WAVE_SPD),PR,H-PR);

    this.dist+=this.spd;
    this.score=Math.floor(this.dist/10);

    // Extend corridor ahead
    while(this._genX<this.dist-PX+W+500) this._extend();
    // Prune old nodes
    const prunX=this.dist-PX-300;
    while(this.nodes.length>2&&this.nodes[1].x<prunX) this.nodes.shift();

    // Coins
    for(const c of this.coins){
      if(!c.done){
        const scx=c.x-(this.dist-PX);
        if(Math.abs(scx-PX)<20&&Math.abs(c.y-this.py)<18){
          c.done=true;totalCoins++;sv('gdCoins',totalCoins);sndCoin();
          for(let i=0;i<10;i++) this.parts.push(
            new Particle(PX,this.py,'#ffd700',(Math.random()-.5)*4,(Math.random()-.5)*4-1,22+Math.random()*12,3));
        }
      }
    }
    this.coins=this.coins.filter(c=>(c.x-(this.dist-PX))>-50);

    // Collision — spike tips are fatal
    if(this.grace<=0){
      const {topY,botY}=sampleCorridor(this.nodes,this.dist);
      if(this.py-PR<topY+TOOTH_H||this.py+PR>botY-TOOTH_H){this._die();return;}
    }

    // Trail + trail particles
    this.trail.add(PX,this.py);
    const skin=SKINS[selSkin];
    if(Math.random()<0.45)
      this.parts.push(new Particle(
        PX-12+(Math.random()-.5)*3,this.py+(Math.random()-.5)*4,
        skin.glow,-1.8-Math.random()*2,(Math.random()-.5)*0.8,12+Math.random()*6,2.5));
    for(const p of this.parts)p.update();
    this.parts=this.parts.filter(p=>p.life>0);

    // Speed lines get faster with scroll
    for(const l of SPEED_LINES) l.x-=(this.spd-3)*0.4;

    if(shakeAmt>0.1)shakeAmt*=0.75;else shakeAmt=0;

    const ach=checkAch(this);
    if(ach){this.achPopup=ach;this.achTimer=180;}
    if(this.achTimer>0)this.achTimer--;
    if(this.score>hiScore){hiScore=this.score;sv('gdHS',hiScore);this.newHS=true;}
  }

  _die(){
    if(!this.alive)return;
    this.alive=false;sndBoom();addShake(14);stopMusic();
    const skin=SKINS[selSkin];
    for(let i=0;i<42;i++){
      const a=Math.random()*Math.PI*2,sp=2+Math.random()*6;
      this.parts.push(new Particle(PX,this.py,i%2===0?skin.primary:'#ffffff',
        Math.cos(a)*sp,Math.sin(a)*sp-1.5,30+Math.random()*26,2+Math.random()*3.5));
    }
    state=S.DEAD;
  }

  draw(){
    // Layered background
    drawBg(this.dist);

    // Speed lines (give motion feel)
    updateSpeedLines();
    drawSpeedLines();

    // Build screen-space corridor
    const off=this.dist-PX;
    const sn=this.nodes.map(n=>({sx:n.x-off,topY:n.topY,botY:n.botY}));

    // Draw corridor
    drawWalls(sn,this.dist);

    // Shake transform
    ctx.save();
    if(shakeAmt>0.1) ctx.translate((Math.random()-.5)*shakeAmt*2,(Math.random()-.5)*shakeAmt*2);

    // Coins
    for(const c of this.coins){
      if(!c.done){const cx=c.x-off;if(cx>-20&&cx<W+20)drawCoin(cx,c.y,this.dist);}
    }

    // Particles
    ctx.save();ctx.globalAlpha=1;
    for(const p of this.parts)p.draw();
    ctx.restore();

    // Trail
    this.trail.draw(SKINS[selSkin]);

    // Player
    if(this.alive||this.deathTimer<16){
      const a=this.alive?1:Math.max(0,1-this.deathTimer/16);
      drawPlayer(this.py,this.pressing,SKINS[selSkin],a,this.grace>0);
    }

    ctx.restore();

    // Vignette overlay
    drawVignette();

    // HUD
    this._hud();
    if(this.achPopup&&this.achTimer>0) drawAchPopup(this.achPopup,this.achTimer);

    // Grace indicator
    if(this.grace>0&&this.alive){
      const frac=this.grace/120;
      ctx.save();
      ctx.globalAlpha=frac*0.7;
      ctx.fillStyle='#00ffcc';
      ctx.font='bold 14px "Segoe UI"';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.shadowBlur=10;ctx.shadowColor='#00ffcc';
      ctx.fillText('● SAFE ZONE',W/2,H-32);
      // progress bar
      const bw=120;
      ctx.fillStyle='rgba(0,255,200,0.2)';
      ctx.fillRect(W/2-bw/2,H-18,bw,6);
      ctx.fillStyle='#00ffcc';ctx.shadowBlur=6;
      ctx.fillRect(W/2-bw/2,H-18,bw*frac,6);
      ctx.restore();
    }
  }

  _hud(){
    ctx.save();
    // Score panel
    ctx.fillStyle='rgba(0,5,15,0.55)';rr(ctx,8,6,160,44,8);ctx.fill();
    ctx.strokeStyle='rgba(0,200,220,0.3)';ctx.lineWidth=1;rr(ctx,8,6,160,44,8);ctx.stroke();
    ctx.fillStyle='#ffffff';ctx.shadowBlur=8;ctx.shadowColor='#00ffcc';
    ctx.font='bold 20px "Segoe UI"';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('SCORE  '+this.score,16,12);
    ctx.font='13px "Segoe UI"';
    ctx.fillStyle=this.newHS?'#ffd700':'#66aacc';
    ctx.shadowColor=this.newHS?'#ffd700':'#66aacc';
    ctx.fillText('BEST  '+hiScore,16,34);
    // Coins + diff
    ctx.fillStyle='rgba(0,5,15,0.55)';rr(ctx,W-130,6,122,44,8);ctx.fill();
    ctx.strokeStyle='rgba(0,200,220,0.3)';ctx.lineWidth=1;rr(ctx,W-130,6,122,44,8);ctx.stroke();
    ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=8;
    ctx.textAlign='right';ctx.font='bold 15px "Segoe UI"';
    ctx.fillText('🪙 '+totalCoins,W-14,12);
    const dc={easy:'#44ff00',normal:'#00ffcc',hard:'#ff5500'}[difficulty];
    ctx.fillStyle=dc;ctx.shadowColor=dc;ctx.font='bold 12px "Segoe UI"';
    ctx.fillText(difficulty.toUpperCase(),W-14,32);
    ctx.restore();
  }
}

// ── Menu background ───────────────────────────────────────────────────────────
let menuT=0;
const mPts=Array.from({length:30},()=>({x:Math.random()*W,y:Math.random()*H,
  vx:(Math.random()-.5)*0.5,vy:(Math.random()-.5)*0.4,r:.8+Math.random()*1.8}));

function menuBg(){
  // Deep background
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#000810');g.addColorStop(1,'#001428');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Scrolling grid
  const G=48,ox=-((menuT*0.8)%G);
  ctx.save();ctx.strokeStyle='rgba(0,150,200,0.14)';ctx.lineWidth=0.8;
  for(let x=ox;x<W+G;x+=G){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=G){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();
  // Floating particles
  ctx.save();
  for(const p of mPts){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.globalAlpha=0.3;ctx.fillStyle='#00ccff';ctx.shadowBlur=6;ctx.shadowColor='#00ccff';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  drawVignette();
}

// ── Input ─────────────────────────────────────────────────────────────────────
function onPress(cx,cy,down){
  ensureAC();
  const lx=cx/scale,ly=cy/scale;
  if(state===S.PLAY){game.setPressed(down);return;}
  if(!down)return;
  for(const b of buttons){
    if(lx>=b.x&&lx<=b.x+b.w&&ly>=b.y&&ly<=b.y+b.h){sndClick();b.action();return;}
  }
}
canvas.addEventListener('mousedown',e=>onPress(e.offsetX,e.offsetY,true));
canvas.addEventListener('mouseup',()=>{if(state===S.PLAY&&game)game.setPressed(false);});
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),t=e.changedTouches[0];onPress(t.clientX-r.left,t.clientY-r.top,true);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(state===S.PLAY&&game)game.setPressed(false);},{passive:false});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();
    if(state===S.PLAY&&game){game.setPressed(true);return;}}
  if(e.code==='Escape'||e.code==='KeyP'){
    if(state===S.PLAY){state=S.PAUSE;stopMusic();}
    else if(state===S.PAUSE){state=S.PLAY;startMusic();}}
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();
    if(state===S.PLAY&&game)game.setPressed(false);}
});

// ── Main loop ─────────────────────────────────────────────────────────────────
let game=null;
function startGame(){game=new Game();state=S.PLAY;startMusic();}

let lastTS=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-lastTS>100){lastTS=ts;return;}
  lastTS=ts;menuT++;buttons=[];
  ctx.clearRect(0,0,W,H);
  switch(state){
    case S.MENU: drawMainMenu();break;
    case S.DIFF: drawDiffMenu();break;
    case S.SKIN: drawSkinMenu();break;
    case S.PLAY:
      game.update();game.draw();
      ctx.save();ctx.font='11px "Segoe UI"';ctx.fillStyle='rgba(0,200,255,0.35)';
      ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('P = pause',W-10,54);ctx.restore();
      break;
    case S.PAUSE: if(game)game.draw();drawPauseOverlay();break;
    case S.DEAD:  if(game){game.update();game.draw();}drawDeadOverlay();break;
  }
}

resize();
requestAnimationFrame(loop);
</script>
