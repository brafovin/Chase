<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Geometric Dash – Flying Wave Challenge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000d1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas { display: block; cursor: pointer; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const BASE_W = 800, BASE_H = 450;
let scale = 1;

function resize() {
  const s = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
  scale = s;
  canvas.width  = BASE_W * s;
  canvas.height = BASE_H * s;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  buildBgCache();
}
window.addEventListener('resize', resize);

// ── Persistence ───────────────────────────────────────────────────────────────
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} };
const load = (k,d) => { try { const v=localStorage.getItem(k); return v!==null?JSON.parse(v):d; } catch(_){ return d; } };

let highScore     = load('wHS2', 0);
let totalCoins    = load('wCoins2', 0);
let unlockedSkins = load('wSkins2', [0]);
let selectedSkin  = load('wSkin2', 0);
let achievements  = load('wAch2', {});

// ── Skins ─────────────────────────────────────────────────────────────────────
const SKINS = [
  { name:'Classic', cost:0,   color:'#00ffcc', glow:'#00ffcc' },
  { name:'Inferno', cost:50,  color:'#ff5500', glow:'#ff8800' },
  { name:'Venom',   cost:100, color:'#44ff00', glow:'#88ff44' },
  { name:'Royal',   cost:150, color:'#cc44ff', glow:'#ee88ff' },
  { name:'Gold',    cost:300, color:'#ffd700', glow:'#ffe566' },
];

// ── Achievements ──────────────────────────────────────────────────────────────
const ACH = [
  { id:'s100',  label:'Novice',      desc:'Score 100',    check: g => g.score>=100 },
  { id:'s500',  label:'Daredevil',   desc:'Score 500',    check: g => g.score>=500 },
  { id:'s1000', label:'Wave Master', desc:'Score 1000',   check: g => g.score>=1000 },
  { id:'c10',   label:'Collector',   desc:'10 coins',     check: ()=> totalCoins>=10 },
  { id:'c50',   label:'Hoarder',     desc:'50 coins',     check: ()=> totalCoins>=50 },
];
function checkAch(game) {
  for (const a of ACH) {
    if (!achievements[a.id] && a.check(game)) {
      achievements[a.id] = true;
      save('wAch2', achievements);
      return a;
    }
  }
  return null;
}

// ── Audio ─────────────────────────────────────────────────────────────────────
let AC = null;
const ensureAC = () => { if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); };

function beep(freq, type, dur, vol=0.15) {
  ensureAC();
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
  o.start(); o.stop(AC.currentTime+dur);
}
const playClick = () => beep(660,'square',0.07);
const playCoin  = () => { beep(1200,'sine',0.06,0.12); setTimeout(()=>beep(2000,'sine',0.08,0.12),60); };
function playExplosion() {
  ensureAC();
  const buf=AC.createBuffer(1,AC.sampleRate*0.25,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; s.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(0.35,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.25);
  s.start();
}

let musicInterval=null;
function startMusic() {
  ensureAC();
  if (musicInterval) return;
  const notes=[261,293,329,349,392,440,493,523];
  const pat=[0,2,4,7,4,2,0,2,4,5,7,5,4,5,7,9];
  let step=0;
  musicInterval = setInterval(()=>{
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type='sawtooth'; o.frequency.value=notes[pat[step%pat.length]%notes.length]*0.5;
    g.gain.setValueAtTime(0.05,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.18);
    o.start(); o.stop(AC.currentTime+0.18);
    step++;
  }, 187);
}
function stopMusic() { if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } }

// ── Background tile cache ─────────────────────────────────────────────────────
// Pre-render a teal brick tile to avoid per-frame shadow calls
const TILE = 40;
let bgCache = null;

function buildBgCache() {
  const off = document.createElement('canvas');
  off.width = TILE*4; off.height = TILE*2;
  const c = off.getContext('2d');

  // Draw 8 brick tiles in a 4x2 pattern with slight variation
  for (let row=0; row<2; row++) {
    for (let col=0; col<4; col++) {
      const x = col*TILE, y = row*TILE;
      // brick face
      c.fillStyle = row%2===0 ? '#0a2a3a' : '#0c3040';
      c.fillRect(x+1,y+1,TILE-2,TILE-2);
      // subtle inner highlight
      c.fillStyle = 'rgba(0,180,220,0.07)';
      c.fillRect(x+3,y+3,TILE-6,TILE/2-3);
      // border
      c.strokeStyle = '#0d4a66';
      c.lineWidth = 1.5;
      c.strokeRect(x+0.75,y+0.75,TILE-1.5,TILE-1.5);
    }
  }
  bgCache = off;
}

function drawBackground(scrollX) {
  if (!bgCache) return;
  const ox = -((scrollX*0.4) % (TILE*4));
  const oy = 0;
  const pw = bgCache.width, ph = bgCache.height;
  for (let x=ox; x<BASE_W+pw; x+=pw) {
    for (let y=oy; y<BASE_H+ph; y+=ph) {
      ctx.drawImage(bgCache, x, y);
    }
  }
}

// ── Constants ─────────────────────────────────────────────────────────────────
const WALL_T   = 36;     // wall thickness top & bottom
const PLAY_TOP = WALL_T;
const PLAY_BOT = BASE_H - WALL_T;
const PLAY_H   = PLAY_BOT - PLAY_TOP;
const PLAYER_X = 120;
const WAVE_SPD = 4.5;    // diagonal speed (px/frame) — same up and down
const SCROLL   = 5.0;
const SPIKE_W  = 32;
const SPIKE_H  = 34;
const SAFE_DIST = 420;   // no spikes until this far from start

// ── Difficulty configs ────────────────────────────────────────────────────────
const DIFFS = {
  easy:   { scroll:3.8, minGap:200, maxGap:320, coinRate:0.25 },
  normal: { scroll:5.0, minGap:160, maxGap:260, coinRate:0.15 },
  hard:   { scroll:6.5, minGap:120, maxGap:190, coinRate:0.10 },
};
let difficulty = 'normal';

// ── Particles ─────────────────────────────────────────────────────────────────
class Particle {
  constructor(x,y,color,vx,vy,life,size) {
    Object.assign(this,{x,y,color,vx,vy,life,maxLife:life,size});
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=0.04; this.life--; }
  draw(ctx){
    const a=this.life/this.maxLife;
    ctx.globalAlpha=a*0.85;
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size*a,0,Math.PI*2);
    ctx.fill();
  }
}

// ── Trail ─────────────────────────────────────────────────────────────────────
class Trail {
  constructor(){ this.pts=[]; }
  add(x,y){ this.pts.push({x,y}); if(this.pts.length>18) this.pts.shift(); }
  draw(ctx,color){
    if(this.pts.length<2) return;
    ctx.save();
    ctx.shadowBlur=0;
    for(let i=1;i<this.pts.length;i++){
      const t=i/this.pts.length;
      ctx.beginPath();
      ctx.moveTo(this.pts[i-1].x,this.pts[i-1].y);
      ctx.lineTo(this.pts[i].x,this.pts[i].y);
      ctx.strokeStyle=color;
      ctx.globalAlpha=t*0.65;
      ctx.lineWidth=t*5;
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ── Screen shake ──────────────────────────────────────────────────────────────
let shakeAmt=0;
const addShake=(a)=>{ shakeAmt=Math.max(shakeAmt,a); };

// ── Buttons ───────────────────────────────────────────────────────────────────
let buttons=[];
function btn(label,x,y,w,h,color,action,sub){
  buttons.push({label,x,y,w,h,color,action,sub});
}
function drawBtns(){
  for(const b of buttons){
    ctx.save();
    ctx.shadowBlur=16; ctx.shadowColor=b.color;
    ctx.fillStyle='rgba(0,0,0,0.65)';
    rr(ctx,b.x,b.y,b.w,b.h,10); ctx.fill();
    ctx.strokeStyle=b.color; ctx.lineWidth=2.2;
    rr(ctx,b.x,b.y,b.w,b.h,10); ctx.stroke();
    ctx.shadowBlur=6; ctx.shadowColor='#fff';
    ctx.fillStyle='#fff';
    ctx.font=`bold ${b.sub?16:19}px "Segoe UI"`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2-(b.sub?7:0));
    if(b.sub){
      ctx.font='12px "Segoe UI"'; ctx.fillStyle='#aaccff';
      ctx.shadowBlur=0;
      ctx.fillText(b.sub,b.x+b.w/2,b.y+b.h/2+10);
    }
    ctx.restore();
  }
}
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ── Point in triangle ─────────────────────────────────────────────────────────
function inTri(p,a,b,c){
  const s=(a.x-c.x)*(p.y-c.y)-(a.y-c.y)*(p.x-c.x);
  const t=(b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x);
  const u=(c.x-b.x)*(p.y-b.y)-(c.y-b.y)*(p.x-b.x);
  return (s>=0&&t>=0&&u>=0)||(s<=0&&t<=0&&u<=0);
}

// ── States ────────────────────────────────────────────────────────────────────
const S={MENU:'menu',DIFF:'diff',SKIN:'skin',PLAY:'play',PAUSE:'pause',DEAD:'dead'};
let state=S.MENU;

// ── Game ──────────────────────────────────────────────────────────────────────
class Game {
  constructor(){
    const cfg=DIFFS[difficulty];
    this.cfg=cfg;
    this.scrollSpeed=cfg.scroll;
    this.distance=0;
    this.score=0;
    this.newHS=false;
    this.particles=[];
    this.trail=new Trail();
    this.spikes=[];
    this.coins=[];
    this.achPopup=null; this.achTimer=0;

    // Player — starts in vertical center, slight grace period
    this.px=PLAYER_X;
    this.py=PLAY_TOP + PLAY_H/2;
    this.pressing=false;
    this.alive=true;
    this.deathTimer=0;
    this.graceFrames=60; // invincible for first 60 frames

    // Populate level ahead
    this._nextX=BASE_W+80;
    for(let i=0;i<10;i++) this._spawnGroup();
  }

  _spawnGroup(){
    const cfg=this.cfg;
    const x=this._nextX;
    const gap=cfg.minGap+Math.random()*(cfg.maxGap-cfg.minGap);

    // 1-3 bottom spikes
    const nb=1+Math.floor(Math.random()*2);
    for(let i=0;i<nb;i++)
      this.spikes.push({x:x+i*(SPIKE_W+2), y:PLAY_BOT, dir:'up'});

    // top spikes occasionally (less frequent)
    if(Math.random()<0.4){
      const nt=1+Math.floor(Math.random()*2);
      const tx=x+Math.random()*30;
      for(let i=0;i<nt;i++)
        this.spikes.push({x:tx+i*(SPIKE_W+2), y:PLAY_TOP, dir:'down'});
    }

    // coin
    if(Math.random()<cfg.coinRate)
      this.coins.push({x:x+gap*0.4, y:PLAY_TOP+30+Math.random()*(PLAY_H-60), done:false});

    this._nextX=x+gap;
  }

  setPressed(v){
    if(!this.alive) return;
    if(v!==this.pressing){ this.pressing=v; playClick(); }
  }

  update(){
    if(!this.alive){
      this.deathTimer++;
      for(const p of this.particles) p.update();
      this.particles=this.particles.filter(p=>p.life>0);
      return;
    }

    if(this.graceFrames>0) this.graceFrames--;

    // True wave movement: constant diagonal, direction flips on press
    const cfg=DIFFS[difficulty];
    this.scrollSpeed=cfg.scroll+this.score*0.0015;
    const vy=this.pressing ? -WAVE_SPD : WAVE_SPD;
    this.py+=vy;

    // Wall death
    if(this.py<=PLAY_TOP+2 || this.py>=PLAY_BOT-2){
      this.py=Math.max(PLAY_TOP+2, Math.min(PLAY_BOT-2, this.py));
      if(this.graceFrames<=0) this._die(); return;
    }

    // Scroll
    const dx=this.scrollSpeed;
    for(const s of this.spikes) s.x-=dx;
    for(const c of this.coins)  c.x-=dx;
    this.distance+=dx;
    this.score=Math.floor(this.distance/10);

    // Spawn more when needed
    if(this._nextX < this.distance + BASE_W + 300){
      this._nextX=this.distance+BASE_W+60;
      for(let i=0;i<5;i++) this._spawnGroup();
    }

    // Cleanup
    this.spikes=this.spikes.filter(s=>s.x>-SPIKE_W*2);
    this.coins =this.coins.filter(c=>c.x>-30);

    // Coin pickup
    for(const c of this.coins){
      if(!c.done && Math.hypot(this.px-c.x,this.py-c.y)<16){
        c.done=true; totalCoins++; save('wCoins2',totalCoins); playCoin();
        for(let i=0;i<10;i++)
          this.particles.push(new Particle(c.x,c.y,'#ffd700',
            (Math.random()-0.5)*4,(Math.random()-0.5)*4-1,20+Math.random()*12,3));
      }
    }

    // Spike collision — only check spikes near player (perf)
    if(this.graceFrames<=0){
      const tip={x:this.px+13,y:this.py};
      const body={x:this.px,y:this.py};
      for(const s of this.spikes){
        if(s.x < this.px-20 || s.x > this.px+30) continue;
        if(this._hitSpike(tip,s)||this._hitSpike(body,s)){ this._die(); return; }
      }
    }

    // Trail + trail particles
    this.trail.add(this.px,this.py);
    const skin=SKINS[selectedSkin];
    if(Math.random()<0.35)
      this.particles.push(new Particle(
        this.px-8+(Math.random()-0.5)*3, this.py+(Math.random()-0.5)*3,
        skin.color, -1-Math.random()*1.5,(Math.random()-0.5)*1, 10+Math.random()*6, 2));
    for(const p of this.particles) p.update();
    this.particles=this.particles.filter(p=>p.life>0);

    // Achievements
    const ach=checkAch(this);
    if(ach){ this.achPopup=ach; this.achTimer=180; }
    if(this.achTimer>0) this.achTimer--;

    if(this.score>highScore){ highScore=this.score; save('wHS2',highScore); this.newHS=true; }
  }

  _hitSpike(pt,s){
    let t,b1,b2;
    if(s.dir==='up'){
      t={x:s.x+SPIKE_W/2,y:s.y-SPIKE_H};
      b1={x:s.x,y:s.y}; b2={x:s.x+SPIKE_W,y:s.y};
    } else {
      t={x:s.x+SPIKE_W/2,y:s.y+SPIKE_H};
      b1={x:s.x,y:s.y}; b2={x:s.x+SPIKE_W,y:s.y};
    }
    return inTri(pt,t,b1,b2);
  }

  _die(){
    if(!this.alive) return;
    this.alive=false; playExplosion(); addShake(10); stopMusic();
    const skin=SKINS[selectedSkin];
    for(let i=0;i<36;i++){
      const a=Math.random()*Math.PI*2, sp=2+Math.random()*5;
      this.particles.push(new Particle(this.px,this.py,
        i%2===0?skin.color:'#ffffff',
        Math.cos(a)*sp,Math.sin(a)*sp-1.5,28+Math.random()*24,2+Math.random()*3));
    }
    state=S.DEAD;
  }

  draw(){
    // Background
    drawBackground(this.distance);

    // Walls
    drawWalls();

    // Apply shake
    ctx.save();
    if(shakeAmt>0.1){
      ctx.translate((Math.random()-0.5)*shakeAmt*2,(Math.random()-0.5)*shakeAmt*2);
      shakeAmt*=0.75;
    } else shakeAmt=0;

    // Spikes
    for(const s of this.spikes) drawSpike(s);

    // Coins
    for(const c of this.coins) if(!c.done) drawCoin(c.x,c.y,this.distance);

    // Particles (behind player)
    ctx.save(); ctx.globalAlpha=1;
    for(const p of this.particles) p.draw(ctx);
    ctx.restore();

    // Trail
    const skin=SKINS[selectedSkin];
    this.trail.draw(ctx,skin.color);

    // Player
    if(this.alive || this.deathTimer<12){
      const a=this.alive?1:Math.max(0,1-this.deathTimer/12);
      drawPlayer(this.px,this.py,this.pressing,skin,a,this.graceFrames>0);
    }

    ctx.restore(); // end shake

    // HUD
    ctx.save();
    ctx.shadowBlur=8; ctx.shadowColor='#00ffcc';
    ctx.fillStyle='#ffffff';
    ctx.font='bold 20px "Segoe UI"';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('SCORE  '+this.score,12,8);
    ctx.font='13px "Segoe UI"';
    ctx.fillStyle=this.newHS?'#ffd700':'#88ccff';
    ctx.shadowColor=this.newHS?'#ffd700':'#88ccff';
    ctx.fillText('BEST  '+highScore,12,32);
    ctx.fillStyle='#ffd700'; ctx.shadowColor='#ffd700';
    ctx.textAlign='right'; ctx.font='bold 15px "Segoe UI"';
    ctx.fillText('🪙 '+totalCoins,BASE_W-12,8);
    const dc={easy:'#44ff00',normal:'#00ffcc',hard:'#ff5500'}[difficulty];
    ctx.fillStyle=dc; ctx.shadowColor=dc;
    ctx.font='bold 12px "Segoe UI"';
    ctx.fillText(difficulty.toUpperCase(),BASE_W-12,28);
    ctx.restore();

    // Achievement popup
    if(this.achPopup && this.achTimer>0) drawAchPopup(this.achPopup,this.achTimer);
  }
}

// ── Draw helpers ──────────────────────────────────────────────────────────────
function drawWalls(){
  ctx.save();
  // teal wall blocks
  ctx.fillStyle='#0d4a66';
  ctx.fillRect(0,0,BASE_W,WALL_T);
  ctx.fillRect(0,PLAY_BOT,BASE_W,WALL_T);

  // glowing edge lines
  ctx.strokeStyle='#00e5ff';
  ctx.lineWidth=2;
  ctx.shadowBlur=12; ctx.shadowColor='#00e5ff';
  ctx.beginPath(); ctx.moveTo(0,WALL_T); ctx.lineTo(BASE_W,WALL_T); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,PLAY_BOT); ctx.lineTo(BASE_W,PLAY_BOT); ctx.stroke();

  // wall spikes (decorative, no hitbox)
  ctx.shadowBlur=0;
  ctx.fillStyle='#00ccdd'; ctx.strokeStyle='#003344'; ctx.lineWidth=1;
  for(let x=0;x<BASE_W;x+=SPIKE_W+2){
    // bottom of ceiling wall
    ctx.beginPath();
    ctx.moveTo(x,WALL_T); ctx.lineTo(x+SPIKE_W/2,WALL_T-12); ctx.lineTo(x+SPIKE_W,WALL_T);
    ctx.fill(); ctx.stroke();
    // top of floor wall
    ctx.beginPath();
    ctx.moveTo(x,PLAY_BOT); ctx.lineTo(x+SPIKE_W/2,PLAY_BOT+12); ctx.lineTo(x+SPIKE_W,PLAY_BOT);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawSpike(s){
  ctx.save();
  ctx.fillStyle='#d0f0ff';
  ctx.strokeStyle='#003344'; ctx.lineWidth=1.5;
  // subtle glow, not per-spike shadow (too slow)
  ctx.beginPath();
  if(s.dir==='up'){
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x+SPIKE_W/2,s.y-SPIKE_H);
    ctx.lineTo(s.x+SPIKE_W,s.y);
  } else {
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x+SPIKE_W/2,s.y+SPIKE_H);
    ctx.lineTo(s.x+SPIKE_W,s.y);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawCoin(x,y,dist){
  const pulse=0.85+0.15*Math.sin(dist*0.06+x);
  ctx.save();
  ctx.globalAlpha=pulse;
  ctx.fillStyle='#ffd700';
  ctx.strokeStyle='#fff8dc'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff8dc';
  ctx.font='bold 9px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('$',x,y);
  ctx.restore();
}

function drawPlayer(px,py,pressing,skin,alpha,grace){
  // angle: tilt up when going up, down when going down
  const angle=(pressing?-1:1)*0.38;
  ctx.save();
  ctx.globalAlpha=alpha*(grace?0.5+0.5*Math.sin(Date.now()*0.02):1);
  ctx.translate(px,py);
  ctx.rotate(angle);
  ctx.shadowBlur=18; ctx.shadowColor=skin.glow;
  ctx.fillStyle=skin.color;
  // arrow/diamond shape matching the photo
  ctx.beginPath();
  ctx.moveTo(15,0);    // nose
  ctx.lineTo(-8,-10);  // top back
  ctx.lineTo(-4,0);    // back notch
  ctx.lineTo(-8,10);   // bottom back
  ctx.closePath();
  ctx.fill();
  // white outline
  ctx.shadowBlur=0;
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5;
  ctx.stroke();
  // bright inner line (like photo)
  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(12,0); ctx.lineTo(-6,-7); ctx.lineTo(-3,0); ctx.lineTo(-6,7);
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function drawAchPopup(ach,timer){
  const fade=Math.min(1,(180-timer)/20)*(timer<40?timer/40:1);
  ctx.save(); ctx.globalAlpha=fade;
  const w=260,h=54,x=(BASE_W-w)/2,y=56;
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=2;
  ctx.shadowBlur=16; ctx.shadowColor='#ffd700';
  rr(ctx,x,y,w,h,10); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0; ctx.fillStyle='#ffd700';
  ctx.font='bold 13px "Segoe UI"'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🏆 '+ach.label+' Unlocked!',BASE_W/2,y+18);
  ctx.fillStyle='#cccccc'; ctx.font='12px "Segoe UI"';
  ctx.fillText(ach.desc,BASE_W/2,y+37);
  ctx.restore();
}

// ── Menu drawing ──────────────────────────────────────────────────────────────
let menuT=0;
const menuPts=Array.from({length:30},()=>({
  x:Math.random()*BASE_W, y:Math.random()*BASE_H,
  vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5,
  r:1+Math.random()*2,
}));

function drawMenuBg(){
  drawBackground(menuT*2);
  // floating dots
  ctx.save();
  for(const p of menuPts){
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=BASE_W; if(p.x>BASE_W)p.x=0;
    if(p.y<0)p.y=BASE_H; if(p.y>BASE_H)p.y=0;
    ctx.globalAlpha=0.35; ctx.fillStyle='#00ccff';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawMainMenu(){
  drawMenuBg();
  const pulse=0.92+0.08*Math.sin(menuT*0.04);
  ctx.save();
  ctx.textAlign='center';
  ctx.font='bold 50px "Segoe UI"'; ctx.fillStyle='#ffffff';
  ctx.shadowBlur=28; ctx.shadowColor='#00ccff';
  ctx.translate(BASE_W/2,0); ctx.scale(pulse,pulse); ctx.translate(-BASE_W/2,0);
  ctx.fillText('GEOMETRIC DASH',BASE_W/2,82);
  ctx.font='bold 20px "Segoe UI"'; ctx.fillStyle='#00eeff';
  ctx.shadowBlur=12;
  ctx.fillText('FLYING WAVE CHALLENGE',BASE_W/2,114);
  ctx.restore();

  ctx.save();
  ctx.textAlign='center'; ctx.font='15px "Segoe UI"';
  ctx.fillStyle='#ffd700'; ctx.shadowBlur=8; ctx.shadowColor='#ffd700';
  ctx.fillText('🏆 BEST: '+highScore+'    🪙 COINS: '+totalCoins,BASE_W/2,148);
  ctx.restore();

  buttons=[];
  const bw=200,bh=50,cx=BASE_W/2-100;
  btn('▶  PLAY',cx,170,bw,bh,'#00ffcc',()=>{ state=S.DIFF; });
  btn('🎨  SKINS',cx,234,bw,bh,'#aa44ff',()=>{ state=S.SKIN; });
  drawBtns();

  ctx.save();
  ctx.textAlign='center'; ctx.font='13px "Segoe UI"';
  ctx.fillStyle='rgba(0,220,255,0.55)';
  ctx.fillText('HOLD to fly up  •  RELEASE to dive',BASE_W/2,BASE_H-18);
  ctx.fillText('SPACE / CLICK / TAP',BASE_W/2,BASE_H-36);
  ctx.restore();
}

function drawDiffMenu(){
  drawMenuBg();
  ctx.save(); ctx.textAlign='center'; ctx.font='bold 32px "Segoe UI"';
  ctx.fillStyle='#fff'; ctx.shadowBlur=18; ctx.shadowColor='#00ccff';
  ctx.fillText('SELECT DIFFICULTY',BASE_W/2,72); ctx.restore();
  buttons=[];
  const bw=210,bh=56,cx=BASE_W/2-105;
  btn('EASY',cx,110,bw,bh,'#44ff00',()=>{ difficulty='easy'; startGame(); },'Relaxed — wide gaps');
  btn('NORMAL',cx,182,bw,bh,'#00ffcc',()=>{ difficulty='normal'; startGame(); },'Classic challenge');
  btn('HARD',cx,254,bw,bh,'#ff5500',()=>{ difficulty='hard'; startGame(); },'Maximum intensity');
  btn('◀ BACK',cx,332,bw,42,'#aaaaaa',()=>{ state=S.MENU; });
  drawBtns();
}

function drawSkinMenu(){
  drawMenuBg();
  ctx.save(); ctx.textAlign='center'; ctx.font='bold 32px "Segoe UI"';
  ctx.fillStyle='#fff'; ctx.shadowBlur=18; ctx.shadowColor='#00ccff';
  ctx.fillText('SHIP SKINS',BASE_W/2,55);
  ctx.font='bold 15px "Segoe UI"'; ctx.fillStyle='#ffd700'; ctx.shadowColor='#ffd700';
  ctx.fillText('🪙 '+totalCoins+' coins',BASE_W/2,84); ctx.restore();

  buttons=[];
  const cols=3,sw=220,sh=96,pad=18;
  const totalW=cols*sw+(cols-1)*pad;
  const sx=(BASE_W-totalW)/2, sy=102;
  SKINS.forEach((skin,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const bx=sx+col*(sw+pad), by=sy+row*(sh+pad);
    const owned=unlockedSkins.includes(i), sel=selectedSkin===i;
    ctx.save();
    ctx.fillStyle=sel?'rgba(0,30,40,0.85)':'rgba(0,0,0,0.5)';
    ctx.strokeStyle=sel?skin.color:'rgba(255,255,255,0.2)';
    ctx.lineWidth=sel?2.5:1.2;
    ctx.shadowBlur=sel?20:0; ctx.shadowColor=skin.glow;
    rr(ctx,bx,by,sw,sh,10); ctx.fill(); ctx.stroke();
    // mini ship
    ctx.translate(bx+34,by+sh/2); ctx.shadowBlur=14; ctx.shadowColor=skin.glow;
    ctx.fillStyle=skin.color;
    ctx.beginPath();
    ctx.moveTo(13,0); ctx.lineTo(-7,-9); ctx.lineTo(-3,0); ctx.lineTo(-7,9);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.setTransform(scale,0,0,scale,0,0);
    ctx.fillStyle='#fff'; ctx.font='bold 14px "Segoe UI"';
    ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.shadowBlur=0;
    ctx.fillText(skin.name,bx+58,by+sh/2-11);
    ctx.font='12px "Segoe UI"';
    ctx.fillStyle=owned?'#88ff88':'#ffcc44';
    ctx.fillText(owned?(sel?'✔ Equipped':'Owned'):`🪙 ${skin.cost}`,bx+58,by+sh/2+8);
    ctx.restore();

    const action=owned?()=>{ selectedSkin=i; save('wSkin2',i); }:()=>{
      if(totalCoins>=skin.cost){ totalCoins-=skin.cost; save('wCoins2',totalCoins);
        unlockedSkins.push(i); save('wSkins2',unlockedSkins); selectedSkin=i; save('wSkin2',i); }
    };
    buttons.push({label:owned?(sel?'ON':'USE'):'BUY',
      x:bx+sw-62,y:by+sh/2-14,w:54,h:28,color:owned?skin.color:'#ffd700',sub:null,action});
  });

  buttons.push({label:'◀ BACK',x:BASE_W/2-100,y:BASE_H-48,w:200,h=36,color:'#aaaaaa',sub:null,
    action:()=>{ state=S.MENU; }});
  drawBtns();
}

function drawPauseOverlay(){
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.save(); ctx.textAlign='center'; ctx.font='bold 42px "Segoe UI"';
  ctx.fillStyle='#fff'; ctx.shadowBlur=20; ctx.shadowColor='#00ccff';
  ctx.fillText('PAUSED',BASE_W/2,BASE_H/2-65); ctx.restore();
  buttons=[];
  const bw=200,bh=48,cx=BASE_W/2-100;
  btn('▶ RESUME',cx,BASE_H/2-26,bw,bh,'#00ffcc',()=>{ state=S.PLAY; startMusic(); });
  btn('↺ RESTART',cx,BASE_H/2+36,bw,bh,'#aa44ff',()=>{ startGame(); });
  btn('⌂ MENU',cx,BASE_H/2+98,bw,bh,'#ff5500',()=>{ state=S.MENU; stopMusic(); });
  drawBtns();
}

function drawDeadOverlay(){
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.save(); ctx.textAlign='center';
  ctx.font='bold 48px "Segoe UI"'; ctx.fillStyle='#ff4444';
  ctx.shadowBlur=22; ctx.shadowColor='#ff0000';
  ctx.fillText('GAME OVER',BASE_W/2,BASE_H/2-92);
  ctx.font='bold 24px "Segoe UI"'; ctx.fillStyle='#fff'; ctx.shadowColor='#00ccff'; ctx.shadowBlur=10;
  ctx.fillText('Score: '+game.score,BASE_W/2,BASE_H/2-50);
  if(game.newHS){
    ctx.font='bold 17px "Segoe UI"'; ctx.fillStyle='#ffd700'; ctx.shadowColor='#ffd700';
    ctx.fillText('🏆 NEW HIGH SCORE!',BASE_W/2,BASE_H/2-22);
  } else {
    ctx.font='15px "Segoe UI"'; ctx.fillStyle='#88ccff';
    ctx.fillText('Best: '+highScore,BASE_W/2,BASE_H/2-22);
  }
  ctx.restore();
  buttons=[];
  const bw=200,bh=48,cx=BASE_W/2-100;
  btn('↺ PLAY AGAIN',cx,BASE_H/2+8,bw,bh,'#00ffcc',()=>{ startGame(); });
  btn('⌂ MENU',cx,BASE_H/2+70,bw,bh,'#aa44ff',()=>{ state=S.MENU; });
  drawBtns();
}

// ── Input ─────────────────────────────────────────────────────────────────────
function onPress(cx,cy,down){
  ensureAC();
  const lx=cx/scale, ly=cy/scale;
  if(state===S.PLAY){ game.setPressed(down); return; }
  if(!down) return;
  for(const b of buttons){
    if(lx>=b.x&&lx<=b.x+b.w&&ly>=b.y&&ly<=b.y+b.h){ playClick(); b.action(); return; }
  }
}

canvas.addEventListener('mousedown', e=>onPress(e.offsetX,e.offsetY,true));
canvas.addEventListener('mouseup',   e=>{ if(state===S.PLAY) game.setPressed(false); });
canvas.addEventListener('touchstart',e=>{ e.preventDefault(); const r=canvas.getBoundingClientRect(),t=e.changedTouches[0]; onPress(t.clientX-r.left,t.clientY-r.top,true); },{passive:false});
canvas.addEventListener('touchend',  e=>{ e.preventDefault(); if(state===S.PLAY) game.setPressed(false); },{passive:false});
window.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault();
    if(state===S.PLAY){ game.setPressed(true); return; } }
  if(e.code==='Escape'||e.code==='KeyP'){
    if(state===S.PLAY){ state=S.PAUSE; stopMusic(); }
    else if(state===S.PAUSE){ state=S.PLAY; startMusic(); } }
});
window.addEventListener('keyup', e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault();
    if(state===S.PLAY) game.setPressed(false); }
});

// ── Bootstrap ─────────────────────────────────────────────────────────────────
let game=null;
function startGame(){
  game=new Game(); state=S.PLAY; startMusic();
}

// ── Main loop ─────────────────────────────────────────────────────────────────
let lastTS=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-lastTS>100){ lastTS=ts; return; } // skip if tab was hidden
  lastTS=ts;
  menuT++;
  buttons=[];
  ctx.clearRect(0,0,BASE_W,BASE_H);

  switch(state){
    case S.MENU:  drawMainMenu(); break;
    case S.DIFF:  drawDiffMenu(); break;
    case S.SKIN:  drawSkinMenu(); break;
    case S.PLAY:
      game.update(); game.draw();
      ctx.save(); ctx.font='12px "Segoe UI"'; ctx.fillStyle='rgba(0,200,255,0.4)';
      ctx.textAlign='right'; ctx.textBaseline='top';
      ctx.fillText('P = pause',BASE_W-10,46); ctx.restore();
      break;
    case S.PAUSE:
      if(game){ game.draw(); } drawPauseOverlay(); break;
    case S.DEAD:
      if(game){ game.update(); game.draw(); } drawDeadOverlay(); break;
  }
}

resize();
requestAnimationFrame(loop);
</script>
